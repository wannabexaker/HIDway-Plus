# Second Windows PC with HIDway installed
remote_pc = gamingpc

# Raspberry Pi that runs the relay
relay = pi

# Only when HIDway is not in the folder Windows has registered for it:
# dir = C:\HIDway
# remote_dir = C:\HIDway
