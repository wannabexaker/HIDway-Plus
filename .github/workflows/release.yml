# Publishes a GitHub release for an annotated vX.Y.Z tag on main: the
# Windows zip (client, probe, Setup.cmd, firmware), the firmware files and
# SHA256SUMS.txt. Everything is built and tested by ci.yml first; nothing is
# published if any job fails.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Annotated tag on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          canonical=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('tools/setup/hidway-updater.psm1').read_text(encoding='ascii')
          values = dict(re.findall(r"Set-Variable -Name (Owner|Repo) -Value '([^']+)'", text))
          assert len(values) == 2
          print(values['Owner'] + '/' + values['Repo'])
          PY
          )
          [[ $GITHUB_REPOSITORY == "$canonical" ]] || {
            echo "::error::Updater is pinned to $canonical; refusing publication from $GITHUB_REPOSITORY."
            exit 1
          }
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [[ $(git cat-file -t "refs/tags/$TAG") == tag ]] || { echo "::error::$TAG is not an annotated tag"; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }

  build:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          title=$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")
          {
            git for-each-ref --format='%(contents:body)' "refs/tags/$TAG"
            echo
            echo "**Windows** (the PC you play from, and the gaming PC): download"
            echo "\`HIDway-$TAG-windows.zip\`, unpack it and run \`HIDway-Setup.exe\`."
            echo "Check for updates downloads Client, Probe and bundled companions for this PC only."
            echo "Close the Windows tools before Install. Rollback restores the previous local tools."
            echo
            echo "**Pico firmware:** \`hidway_fw_<board>.uf2\` for Pico, Pico W, Pico 2 and"
            echo "Pico 2 W. Hold BOOTSEL while plugging the Pico in, then copy the file to it."
            echo
            echo "**Raspberry Pi:** \`hidway-update\` installs this tag (docs/RELAY.md)."
            echo
            echo "SHA-256 checksums: \`SHA256SUMS.txt\`."
          } >notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists. Publish a new version instead of replacing update assets."
            exit 1
          else
            gh release create "$TAG" release/* --draft --verify-tag --title "${title:-HIDway $TAG}" --notes-file notes.md
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >release-metadata.json
            export EXPECTED_SHA256
            EXPECTED_SHA256=$(sha256sum "release/HIDway-$TAG-windows.zip" | cut -d' ' -f1)
            python3 - <<'PY'
          import json, os
          tag = os.environ['TAG']
          name = f'HIDway-{tag}-windows.zip'
          release = json.load(open('release-metadata.json', encoding='utf-8'))
          assets = [a for a in release['assets'] if a['name'] == name]
          assert len(assets) == 1, 'Expected exactly one Windows ZIP'
          asset = assets[0]
          expected_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{name}"
          assert asset['browser_download_url'] == expected_url, 'Wrong download URL'
          assert asset['state'] == 'uploaded' and 1 < asset['size'] <= 128 * 1024 * 1024, 'Invalid asset state or size'
          assert asset['digest'] == 'sha256:' + os.environ['EXPECTED_SHA256'], 'GitHub digest mismatch'
          PY
            gh release edit "$TAG" --draft=false
          fi
